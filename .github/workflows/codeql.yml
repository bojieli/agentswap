name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A weekly run catches advisories published after the code stopped changing.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # Uploading results needs code scanning, which a private repository only has
    # with GitHub Advanced Security. Without it the analysis runs perfectly and
    # then fails at the upload, leaving a red check on every pull request that
    # nothing in the code can fix. This turns itself on when the repository is
    # published.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than adding to
      # it, so contents: read has to be repeated or the checkout cannot see a
      # private repository.
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
