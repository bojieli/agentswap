name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor is what go.mod promises; stable is what most people will
        # actually build with.
        go: ['1.23', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The end-to-end suite drives a compiled binary, so its coverage arrives
      # as counter files from a subprocess rather than a profile. Collecting
      # both into one directory lets `covdata` merge them, which is the only
      # way the CLI layer's real coverage shows up at all.
      - name: test with coverage
        run: |
          set -euo pipefail
          mkdir -p .coverdata
          go test -cover ./internal/... ./cmd/... -args -test.gocoverdir="$PWD/.coverdata"
          E2E_COVERDIR="$PWD/.coverdata" go test ./e2e/

      - name: report
        run: |
          set -euo pipefail
          go tool covdata percent -i=.coverdata
          go tool covdata textfmt -i=.coverdata -o=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: enforce a floor
        # Not a target to chase, just a ratchet against a large untested
        # addition slipping in unnoticed.
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=75.0
          echo "total coverage: $total% (floor $floor%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "coverage fell below the floor"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    # CodeQL cannot upload findings from a private repository, so this is the
    # security scan that actually runs. It checks the standard library and the
    # toolchain against the Go vulnerability database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # v9 of the action is what installs golangci-lint v2, which .golangci.yml
      # is written for. The version is pinned so a linter release cannot turn a
      # green pull request red without a commit that says so.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: no third-party dependencies
        # agentswap holds live OAuth tokens. Keeping the dependency set empty is
        # a deliberate security property, so regressions should fail the build.
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is not empty — a third-party dependency was added:"
            cat go.sum
            exit 1
          fi
          if grep -qE '^[[:space:]]*require' go.mod; then
            echo "go.mod declares a requirement:"
            cat go.mod
            exit 1
          fi

  cross-build:
    # Every platform in the release matrix has to compile on every commit,
    # rather than first being discovered broken at tag time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build every release target
        run: |
          set -euo pipefail
          while read -r os arch; do
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/agentswap
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64
          freebsd amd64
          TARGETS
