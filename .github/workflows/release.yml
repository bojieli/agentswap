name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: validate tag
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tags must look like v1.2.3: $VERSION" >&2; exit 1 ;;
          esac
          test "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" || {
            echo "$VERSION does not point at the checked-out commit" >&2
            exit 1
          }

      # A release that cannot pass its own tests is not a release.
      - name: test
        run: make check

      - name: build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r os arch; do
            name="agentswap"
            [ "$os" = "windows" ] && name="agentswap.exe"
            dir="dist/agentswap_${VERSION}_${os}_${arch}"
            mkdir -p "$dir"

            # -trimpath keeps build paths out of the binary; CGO_ENABLED=0
            # makes the Linux builds work on any libc.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$dir/$name" ./cmd/agentswap

            cp README.md LICENSE "$dir/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "$(basename "$dir").zip" "$(basename "$dir")")
            else
              (cd dist && tar -czf "$(basename "$dir").tar.gz" "$(basename "$dir")")
            fi
            rm -rf "$dir"
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64
          freebsd amd64
          TARGETS

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

          # The Homebrew formula is an ordinary release asset. It selects the
          # right archive for Apple Silicon versus Intel at install time and
          # embeds the same checksums published above.
          scripts/generate-homebrew-formula.sh "$VERSION" dist dist/agentswap.rb

          # Fail before publishing if an archive or checksum is malformed.
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" -eq 7
          (cd dist && sha256sum -c SHA256SUMS)
          ls -la dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "go install github.com/bojieli/agentswap/cmd/agentswap@${VERSION}"
            echo '```'
            echo
            echo "Or download a binary below and put it on your PATH."
            echo "Verify it with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "## Changes"
            echo
            if prev=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null); then
              git log --no-merges --pretty='- %s' "${prev}..${VERSION}"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > "$notes"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --title "${VERSION}" \
              --notes-file "$notes"
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --notes-file "$notes" \
              dist/*
          fi

      - name: attest release assets
        uses: actions/attest-build-provenance@v2
        if: github.event.repository.private == false
        with:
          subject-path: 'dist/*'
