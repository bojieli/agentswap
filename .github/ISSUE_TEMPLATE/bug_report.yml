name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this involves a credential being leaked or wrongly accepted, please
        report it privately instead — see
        [SECURITY.md](https://github.com/bojieli/agentswap/blob/main/SECURITY.md).

  - type: textarea
    id: doctor
    attributes:
      label: agentswap doctor
      description: |
        Paste the full output. It walks the chain in the order a request
        travels it, so the first failure is usually the whole answer.
      render: text
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Daemon logs
      description: |
        Output from `agentswap serve -v` covering the failure, if you have it.
        agentswap never logs credentials, but please check anything you paste.
      render: text

  - type: input
    id: version
    attributes:
      label: agentswap version
      placeholder: output of `agentswap version`
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Which CLI, and which version
      placeholder: 'e.g. claude 2.4.1, or codex 0.55.0'
    validations:
      required: true

  - type: dropdown
    id: accounts
    attributes:
      label: What is in the pool
      multiple: true
      options:
        - One subscription
        - Several subscriptions
        - API key(s)
        - A third-party base_url
    validations:
      required: true
